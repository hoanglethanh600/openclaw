services:
  - type: web
    name: openclaw
    runtime: docker
    plan: free
    region: singapore
    # Free tier (per OpenClaw's own Render guide): plan "free" and NO
    # persistent disk -- Render rejects a disk on a free instance, and
    # OpenClaw state resets whenever the service restarts or redeploys.
    # Free instances also spin down after ~15 min idle (slow cold start).
    # The image CMD has no --allow-unconfigured, so a fresh state dir with
    # no openclaw.json exits before binding; the flag has to come from here.
    dockerCommand: node openclaw.mjs gateway --allow-unconfigured
    healthCheckPath: /startupz
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: "8080"
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      # Keep the Node heap inside the free instance's 512MB RAM.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: OPENCLAW_NO_RESPAWN
        value: "1"
